# Security & Network Hardening (Connection level, doesn't affect headers)
server_tokens off;
client_max_body_size 10M;
tcp_nopush on;
tcp_nodelay on;

charset utf-8;

# Gzip Optimization
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6; # 6 is the "sweet spot" between CPU usage and compression ratio
gzip_min_length 1024; # Don't compress files smaller than 1kb

gzip_types
    application/javascript
    application/x-javascript
    application/wasm
    application/json
    application/xml
    text/css
    text/plain
    text/javascript
    image/svg+xml;

# 1. HTTP to HTTPS Redirect
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. The Transparent SSL Proxy
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/localhost+2.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost+2-key.pem;

    location / {
        # --- TRANSPARENCY SETTINGS ---
        
        # 1. Clear any Nginx-default header interference
        # By default, Nginx might try to set 'Server' or 'Date'. 
        # We can't easily stop 'Date', but we can stop custom additions.
        # Ensure NO 'add_header' directives exist in this block.

        # 2. Forward the request exactly as is
        proxy_pass http://host.docker.internal:3000;
        
        # 3. Standard identification headers (Required so the backend knows the source)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # We add a dummy header that does nothing to clear the inherited list.
        add_header X-Proxy-Clean "true";

        # 4. WebSockets / HMR support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 5. Disable Buffering
        # This ensures headers and data are sent to the client immediately
        # as they arrive from the backend.
        proxy_buffering off;
        proxy_request_buffering off;

    }
}

# Mapping for WebSocket Connection header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}