server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain or IP address
    server_name _;

    # The directory where your Vite 'dist' folder is located
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # Gzip Compression Configuration
    # ==========================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; # 6 is the sweet spot for compression vs CPU overhead
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        application/wasm
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Hide Nginx version number in the 'Server' header
    server_tokens off;


    # ==========================================
    # Global Security Headers
    # (These apply to any block that DOES NOT have its own add_header)
    # ==========================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # ==========================================
    # Location Blocks & Caching Strategies
    # ==========================================

    # 1. Vite Hashed Assets (Aggressive/Immutable Caching)
    # Vite places compiled CSS, JS, and imported media into the /assets/ folder 
    # with content hashes (e.g., main-8f4b2a.js). These files never change.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Your WASM Headers
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location ^~ /static/ {
        access_log off;
        # Caching Strategy: Always check ETag for updates
        etag on;
        add_header Cache-Control "no-cache";

        # Security Headers (Required due to Nginx inheritance)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # 2. Public Folder Media & Fonts (Standard Caching)
    # Files served directly from your Vite `public` directory (e.g., favicons, 
    # og-images, robots.txt, fonts) do not get hashed. They need a reasonable cache 
    # but should allow for eventual updates.
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|svg|bmp|woff2?|eot|ttf|otf|mp4|webm|ogg|mp3|wav|flac|aac|pdf|json|xml|csv|txt|js|mjs|css|wasm|srt)$ {
        access_log off;
        # 1. Turn on ETags (Nginx will automatically generate a hash based on file modification time and size)
        etag on;

        # 2. Force the browser to validate the ETag with the server
        add_header Cache-Control "no-cache";


        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Your WASM Headers
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # 3. Main Entry Point & Client-Side Routing (No Caching)
    # This block handles React Router's client-side navigation. 
    # index.html MUST NOT be cached, ensuring users always fetch the latest pointers 
    # to your newly hashed /assets/ files upon a new deployment.

    location / {
        try_files $uri $uri/ /index.html;
        
        # Kill cache completely for HTML
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Your WASM Headers
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

}